<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NexusHire - Create account</title>
  <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="auth-page">
  <main class="auth-card">
    <h1 class="brand">Nexus<span>Hire</span></h1>
    <p class="subtitle">Create your account</p>

    <div class="alert alert-error" th:if="${error}" th:text="${error}"></div>

    <form method="post" th:action="@{/register}">
      <label for="name">Full name</label>
      <input type="text" id="name" name="name" th:value="${name}" required>

      <label for="email">Email</label>
      <input type="email" id="email" name="email" th:value="${email}" required>

      <label for="password">Password (at least 6 characters)</label>
      <input type="password" id="password" name="password" required>

      <label for="confirm">Confirm password</label>
      <input type="password" id="confirm" name="confirm" required>

      <label for="role">I am a</label>
      <select id="role" name="role">
        <option value="JOB_SEEKER" th:selected="${role != 'EMPLOYER'}">Job Seeker</option>
        <option value="EMPLOYER" th:selected="${role == 'EMPLOYER'}">Employer</option>
      </select>

      <div id="resumeBox">
        <label for="resume">Resume (optional)</label>
        <textarea id="resume" name="resume" rows="5" th:text="${resume}"></textarea>
      </div>

      <button type="submit" class="btn btn-primary">Create account</button>
    </form>

    <p class="switch">Already have an account? <a th:href="@{/login}">Login</a></p>
  </main>

  <script>
    // Show the resume box only for job seekers
    const role = document.getElementById('role');
    const box = document.getElementById('resumeBox');
    function toggleResume() { box.style.display = role.value === 'JOB_SEEKER' ? 'block' : 'none'; }
    role.addEventListener('change', toggleResume);
    toggleResume();
  </script>
</body>
</html>
