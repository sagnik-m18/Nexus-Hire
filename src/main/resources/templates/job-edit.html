<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NexusHire - Edit job</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" th:href="@{/css/app.css(v=3)}">
</head>
<body class="app">
  <div th:replace="~{fragments/icons :: sprite}"></div>

  <div class="app-shell">
    <aside th:replace="~{shell :: sidebar('myjobs')}"></aside>

    <div class="app-main">
      <header th:replace="~{shell :: topbar}"></header>

      <main class="app-content">
        <div class="page-head">
          <span class="page-icon"><svg class="icon" width="32" height="32" aria-hidden="true"><use href="#i-send"/></svg></span>
          <h1 class="page-title">Edit job</h1>
        </div>
        <p class="page-sub">Update the details of your job opening</p>

        <p class="alert alert-error" th:if="${error}" th:text="${error}"></p>
        <p class="alert alert-info" th:if="${jobStatus != 'PENDING'}">
          After you save, an admin has to approve this job again before job seekers can see it.
        </p>

        <div class="form-layout">
          <div>
            <form class="form-card panel" method="post" th:action="@{/employer/jobs/{id}(id=${jobId})}">
              <div class="field">
                <label for="title">Job title</label>
                <div class="input-wrap">
                  <svg class="icon" width="18" height="18" aria-hidden="true"><use href="#i-briefcase"/></svg>
                  <input id="title" name="title" type="text" maxlength="150" required placeholder="Enter job title" th:value="${title}">
                </div>
              </div>

              <div class="field">
                <label for="company">Company</label>
                <div class="input-wrap">
                  <svg class="icon" width="18" height="18" aria-hidden="true"><use href="#i-building"/></svg>
                  <input id="company" name="company" type="text" maxlength="150" required placeholder="Enter company name" th:value="${company}">
                </div>
              </div>

              <div class="field">
                <label for="location">Location</label>
                <div class="input-wrap">
                  <svg class="icon" width="18" height="18" aria-hidden="true"><use href="#i-pin"/></svg>
                  <input id="location" name="location" type="text" maxlength="100" required placeholder="Enter location" th:value="${location}">
                </div>
              </div>

              <div class="field">
                <label for="salary">Salary <span class="opt">(optional)</span></label>
                <div class="input-wrap">
                  <span class="glyph" aria-hidden="true">&#8377;</span>
                  <input id="salary" name="salary" type="text" inputmode="numeric" placeholder="For example 600000" th:value="${salary}">
                </div>
              </div>

              <div class="field">
                <label for="description">Description</label>
                <textarea id="description" name="description" rows="8" maxlength="5000" required
                          placeholder="Describe the job role, responsibilities and requirements..." th:text="${description}"></textarea>
              </div>

              <div class="form-actions">
                <button type="submit" class="btn btn-lg btn-block"><svg class="icon" width="17" height="17" aria-hidden="true"><use href="#i-send"/></svg>Save changes</button>
              </div>
            </form>

            <p class="back-row"><a class="link-btn" th:href="@{/employer/jobs}">Cancel and go back to my jobs</a></p>
          </div>

          <div class="form-art" aria-hidden="true">
            <div th:replace="~{fragments/art :: briefcase-plus}"></div>
          </div>
        </div>
      </main>
    </div>
  </div>
</body>
</html>
