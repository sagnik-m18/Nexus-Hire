<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NexusHire - Browse jobs</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" th:href="@{/css/app.css(v=3)}">
</head>
<body class="app">
  <div th:replace="~{fragments/icons :: sprite}"></div>

  <div class="app-shell">
    <aside th:replace="~{shell :: sidebar('browse')}"></aside>

    <div class="app-main">
      <header th:replace="~{shell :: topbar}"></header>

      <main class="app-content">
        <div class="page-head">
          <span class="page-icon"><svg class="icon" width="32" height="32" aria-hidden="true"><use href="#i-briefcase"/></svg></span>
          <h1 class="page-title">Browse jobs</h1>
        </div>
        <p class="page-sub">Find the best opportunities for your career</p>

        <form class="search-bar panel" method="get" th:action="@{/jobs}">
          <div class="search-field">
            <svg class="icon" width="18" height="18" aria-hidden="true"><use href="#i-search"/></svg>
            <input type="text" name="keyword" placeholder="Job title or company" th:value="${keyword}" aria-label="Job title or company">
          </div>
          <div class="search-field">
            <svg class="icon" width="18" height="18" aria-hidden="true"><use href="#i-pin"/></svg>
            <input type="text" name="location" placeholder="Location" th:value="${location}" aria-label="Location">
          </div>
          <button type="submit" class="btn"><svg class="icon" width="17" height="17" aria-hidden="true"><use href="#i-search"/></svg>Search</button>
        </form>

        <p class="alert alert-error" th:if="${error}" th:text="${error}"></p>

        <div class="job-list">
          <a class="job-card panel" th:each="job : ${jobs}" th:href="@{/jobs/{id}(id=${job.id})}">
            <span class="job-badge"><svg class="icon" width="22" height="22" aria-hidden="true"><use href="#i-briefcase"/></svg></span>
            <span class="job-info">
              <strong th:text="${job.title}">Title</strong>
              <span class="job-meta">
                <span class="meta-item"><svg class="icon" width="15" height="15" aria-hidden="true"><use href="#i-pin"/></svg><span th:text="${job.company} + ', ' + ${job.location}">Company, Location</span></span>
                <span class="meta-item" th:text="${job.salary > 0} ? ${#numbers.formatDecimal(job.salary, 1, 'COMMA', 0, 'POINT')} : 'Salary not listed'">Salary</span>
              </span>
            </span>
            <span class="job-go"><svg class="icon" width="20" height="20" aria-hidden="true"><use href="#i-arrow"/></svg></span>
          </a>
        </div>

        <div class="empty panel" th:if="${#lists.isEmpty(jobs) and error == null}">
          <div th:replace="~{fragments/art :: empty-briefcase}"></div>
          <p>No jobs match your search. Try a different keyword or clear the location.</p>
        </div>
      </main>
    </div>
  </div>
</body>
</html>
