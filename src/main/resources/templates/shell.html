<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<body>

<!-- Sidebar. Usage: <aside th:replace="~{shell :: sidebar('review')}"></aside>
     active = dashboard | browse | review | all | users | applications | profile | myjobs | post -->
<aside class="sidebar" th:fragment="sidebar(active)">
  <a class="side-brand" th:href="@{/dashboard}">
    <svg class="side-logo" width="34" height="34" aria-hidden="true"><use href="#i-logo"/></svg>
    <span class="brand">Nexus<span>Hire</span></span>
  </a>

  <nav class="side-nav" th:if="${currentUser != null}" aria-label="Main">
    <a class="side-link" th:href="@{/dashboard}" th:classappend="${active == 'dashboard'} ? 'is-active'">
      <svg class="icon" width="19" height="19" aria-hidden="true"><use href="#i-home"/></svg><span>Dashboard</span>
    </a>
    <a class="side-link" th:href="@{/jobs}" th:classappend="${active == 'browse'} ? 'is-active'">
      <svg class="icon" width="19" height="19" aria-hidden="true"><use href="#i-search"/></svg><span>Browse jobs</span>
    </a>

    <a class="side-link" th:if="${currentUser.role.name() == 'JOB_SEEKER'}" th:href="@{/applications}" th:classappend="${active == 'applications'} ? 'is-active'">
      <svg class="icon" width="19" height="19" aria-hidden="true"><use href="#i-file"/></svg><span>My applications</span>
    </a>
    <a class="side-link" th:if="${currentUser.role.name() == 'JOB_SEEKER'}" th:href="@{/profile}" th:classappend="${active == 'profile'} ? 'is-active'">
      <svg class="icon" width="19" height="19" aria-hidden="true"><use href="#i-user"/></svg><span>My profile</span>
    </a>

    <a class="side-link" th:if="${currentUser.role.name() == 'EMPLOYER'}" th:href="@{/employer/jobs}" th:classappend="${active == 'myjobs'} ? 'is-active'">
      <svg class="icon" width="19" height="19" aria-hidden="true"><use href="#i-briefcase"/></svg><span>My jobs</span>
    </a>
    <a class="side-link" th:if="${currentUser.role.name() == 'EMPLOYER'}" th:href="@{/employer/jobs/new}" th:classappend="${active == 'post'} ? 'is-active'">
      <svg class="icon" width="19" height="19" aria-hidden="true"><use href="#i-plus"/></svg><span>Post a job</span>
    </a>

    <a class="side-link" th:if="${currentUser.role.name() == 'ADMIN'}" th:href="@{/admin/jobs}" th:classappend="${active == 'review'} ? 'is-active'">
      <svg class="icon" width="19" height="19" aria-hidden="true"><use href="#i-clipboard"/></svg><span>Review jobs</span>
    </a>
    <a class="side-link" th:if="${currentUser.role.name() == 'ADMIN'}" th:href="@{/admin/all-jobs}" th:classappend="${active == 'all'} ? 'is-active'">
      <svg class="icon" width="19" height="19" aria-hidden="true"><use href="#i-list"/></svg><span>All jobs</span>
    </a>
    <a class="side-link" th:if="${currentUser.role.name() == 'ADMIN'}" th:href="@{/admin/users}" th:classappend="${active == 'users'} ? 'is-active'">
      <svg class="icon" width="19" height="19" aria-hidden="true"><use href="#i-users"/></svg><span>Users</span>
    </a>
  </nav>

  <div class="side-card" th:if="${currentUser != null and currentUser.role.name() == 'ADMIN'}">
    <span class="side-card-icon"><svg class="icon" width="20" height="20" aria-hidden="true"><use href="#i-shield"/></svg></span>
    <strong>Admin Panel</strong>
    <small>Secure Access</small>
  </div>
  <div class="side-card" th:if="${currentUser != null and currentUser.role.name() != 'ADMIN'}">
    <span class="side-card-icon"><svg class="icon" width="20" height="20" aria-hidden="true"><use href="#i-briefcase"/></svg></span>
    <small>Smarter Hiring.<br>A Stronger Future.</small>
  </div>
</aside>

<!-- Top bar. Usage: <header th:replace="~{shell :: topbar}"></header> -->
<header class="topbar" th:fragment="topbar">
  <div class="top-badge" aria-hidden="true">
    <svg class="icon" width="22" height="22" th:if="${currentUser != null and currentUser.role.name() == 'ADMIN'}"><use href="#i-shield"/></svg>
    <svg class="icon" width="22" height="22" th:if="${currentUser != null and currentUser.role.name() != 'ADMIN'}"><use href="#i-briefcase"/></svg>
  </div>
  <div class="topbar-right" th:if="${currentUser != null}">
    <span class="top-user">
      <svg class="icon" width="18" height="18" aria-hidden="true" th:if="${currentUser.role.name() == 'ADMIN'}"><use href="#i-shield"/></svg>
      <svg class="icon" width="18" height="18" aria-hidden="true" th:if="${currentUser.role.name() != 'ADMIN'}"><use href="#i-user"/></svg>
      <span th:text="${currentUser.name} + ' (' + ${currentUser.role} + ')'">Site Admin (ADMIN)</span>
    </span>
    <form method="post" th:action="@{/logout}">
      <button type="submit" class="top-logout"><svg class="icon" width="18" height="18" aria-hidden="true"><use href="#i-logout"/></svg>Logout</button>
    </form>
  </div>
</header>

</body>
</html>
