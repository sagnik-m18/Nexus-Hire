<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NexusHire - My applications</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" th:href="@{/css/app.css(v=3)}">
</head>
<body class="app">
  <div th:replace="~{fragments/icons :: sprite}"></div>

  <div class="app-shell">
    <aside th:replace="~{shell :: sidebar('applications')}"></aside>

    <div class="app-main">
      <header th:replace="~{shell :: topbar}"></header>

      <main class="app-content">
        <div class="page-top">
          <div>
            <div class="page-head">
              <span class="page-icon"><svg class="icon" width="32" height="32" aria-hidden="true"><use href="#i-file"/></svg></span>
              <h1 class="page-title">My applications</h1>
            </div>
            <p class="page-sub">Follow the status of every job you applied for</p>
          </div>
          <a class="btn btn-lg" th:href="@{/jobs}">Browse jobs <svg class="icon" width="17" height="17" aria-hidden="true"><use href="#i-arrow"/></svg></a>
        </div>

        <p class="alert alert-ok" th:if="${success}" th:text="${success}"></p>
        <p class="alert alert-error" th:if="${error}" th:text="${error}"></p>
        <p class="alert alert-error" th:if="${loadError}" th:text="${loadError}"></p>

        <div class="job-list">
          <th:block th:each="row : ${rows}">
            <a class="job-card panel" th:if="${row.job != null}" th:href="@{/jobs/{id}(id=${row.job.id})}">
              <span class="job-badge"><svg class="icon" width="22" height="22" aria-hidden="true"><use href="#i-file"/></svg></span>
              <span class="job-info">
                <span class="job-title-row">
                  <strong th:text="${row.job.title}">Title</strong>
                  <span class="pill" th:classappend="'status-' + ${#strings.toLowerCase(row.application.status.name())}"
                        th:text="${#strings.capitalize(#strings.toLowerCase(#strings.replace(row.application.status.name(), '_', ' ')))}">Applied</span>
                </span>
                <span class="job-meta">
                  <span class="meta-item"><svg class="icon" width="15" height="15" aria-hidden="true"><use href="#i-pin"/></svg><span th:text="${row.job.company} + ', ' + ${row.job.location}">Company, Location</span></span>
                  <span class="meta-item"><svg class="icon" width="15" height="15" aria-hidden="true"><use href="#i-clock"/></svg><span th:text="'Applied on ' + ${row.application.appliedAt.toLocalDate()}">Applied on</span></span>
                </span>
              </span>
              <span class="job-go"><svg class="icon" width="20" height="20" aria-hidden="true"><use href="#i-arrow"/></svg></span>
            </a>
          </th:block>
        </div>

        <div class="empty panel" th:if="${#lists.isEmpty(rows) and loadError == null}">
          <div th:replace="~{fragments/art :: empty-clipboard}"></div>
          <h3>No applications yet</h3>
          <p>You have not applied to any jobs yet. Browse jobs and use "Apply for this job" on one you like.</p>
        </div>
      </main>
    </div>
  </div>
</body>
</html>
