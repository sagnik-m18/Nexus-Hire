<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title th:text="'NexusHire - ' + ${job.title}">NexusHire</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" th:href="@{/css/app.css(v=3)}">
</head>
<body class="app">
  <div th:replace="~{fragments/icons :: sprite}"></div>

  <div class="app-shell">
    <aside th:replace="~{shell :: sidebar('browse')}"></aside>

    <div class="app-main">
      <header th:replace="~{shell :: topbar}"></header>

      <main class="app-content">
        <a class="back-link" th:href="@{/jobs}"><svg class="icon" width="17" height="17" aria-hidden="true"><use href="#i-arrow"/></svg>Back to all jobs</a>

        <article class="detail panel">
          <h1 th:text="${job.title}">Title</h1>
          <div class="detail-meta">
            <span class="meta-item"><svg class="icon" width="16" height="16" aria-hidden="true"><use href="#i-pin"/></svg><span th:text="${job.company} + ', ' + ${job.location}">Company, Location</span></span>
            <span class="meta-item"><strong>Salary:</strong>
              <span th:text="${job.salary > 0} ? ${#numbers.formatDecimal(job.salary, 1, 'COMMA', 0, 'POINT')} : 'Not listed'">Salary</span>
            </span>
            <span class="meta-item"><strong>Posted:</strong> <span th:text="${job.postedAt.toLocalDate()}">2026-01-01</span>
              <span class="pill" th:if="${job.status.name() != 'APPROVED'}"
                    th:classappend="'status-' + ${#strings.toLowerCase(job.status.name())}"
                    th:text="${#strings.toLowerCase(job.status.name())}">pending</span>
            </span>
          </div>

          <h2>About the job</h2>
          <p class="detail-text" th:text="${job.description}">Description</p>

          <p class="detail-actions" th:if="${currentUser.role.name() == 'JOB_SEEKER' and job.status.name() == 'APPROVED'}">
            <a class="btn btn-lg" th:href="@{/jobs/{id}/apply(id=${job.id})}">Apply for this job <svg class="icon" width="17" height="17" aria-hidden="true"><use href="#i-arrow"/></svg></a>
          </p>
        </article>
      </main>
    </div>
  </div>
</body>
</html>
