<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NexusHire - Login</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" th:href="@{/css/style.css}">
  <link rel="stylesheet" th:href="@{/css/auth.css(v=3)}">
</head>
<body class="auth-page">
  <div th:replace="~{fragments/icons :: sprite}"></div>

  <div class="auth-frame">
    <aside class="auth-aside">
      <div class="logo">
        <svg class="logo-svg" width="36" height="36" aria-hidden="true"><use href="#i-logo"/></svg>
        <span class="brand">Nexus<span>Hire</span></span>
      </div>

      <div class="aside-hero">
        <h2 class="aside-title">Your next <span class="accent">opportunity</span> starts here.</h2>
        <p class="aside-text">Connect. Apply. Grow.</p>
      </div>

      <div class="aside-art" aria-hidden="true">
        <div th:replace="~{fragments/art :: laptop}"></div>
      </div>

      <div class="aside-features">
        <div><svg class="icon" width="20" height="20" aria-hidden="true"><use href="#i-zap"/></svg><span>Find the best opportunities</span></div>
        <div><svg class="icon" width="20" height="20" aria-hidden="true"><use href="#i-users"/></svg><span>Connect with top employers</span></div>
        <div><svg class="icon" width="20" height="20" aria-hidden="true"><use href="#i-chart"/></svg><span>Grow your career</span></div>
      </div>
    </aside>

    <main class="auth-main">
      <section class="auth-card">
        <div class="brand auth-mobile-brand">Nexus<span>Hire</span></div>
        <h1 class="card-title">Welcome Back!</h1>
        <p class="subtitle">Sign in to your NexusHire account</p>

        <div class="alert alert-success" th:if="${success}" th:text="${success}"></div>
        <div class="alert alert-error" th:if="${error}" th:text="${error}"></div>

        <form method="post" th:action="@{/login}">
          <fieldset class="role-picker">
            <legend class="visually-hidden">Log in as</legend>
            <div class="role-options">
              <label class="role-option">
                <input type="radio" name="role" value="JOB_SEEKER" th:checked="${role == null or role == 'JOB_SEEKER'}">
                <span><svg class="icon" width="20" height="20" aria-hidden="true"><use href="#i-briefcase"/></svg>Job Seeker</span>
              </label>
              <label class="role-option">
                <input type="radio" name="role" value="EMPLOYER" th:checked="${role == 'EMPLOYER'}">
                <span><svg class="icon" width="20" height="20" aria-hidden="true"><use href="#i-users"/></svg>Employer</span>
              </label>
              <label class="role-option">
                <input type="radio" name="role" value="ADMIN" th:checked="${role == 'ADMIN'}">
                <span><svg class="icon" width="20" height="20" aria-hidden="true"><use href="#i-shield"/></svg>Admin</span>
              </label>
            </div>
          </fieldset>

          <div class="field">
            <label for="email" class="visually-hidden">Email address</label>
            <div class="input-wrap">
              <svg class="icon" width="20" height="20" aria-hidden="true"><use href="#i-mail"/></svg>
              <input type="email" id="email" name="email" th:value="${email}" placeholder="Email Address" autocomplete="email" required>
            </div>
          </div>

          <div class="field">
            <label for="password" class="visually-hidden">Password</label>
            <div class="input-wrap has-toggle">
              <svg class="icon" width="20" height="20" aria-hidden="true"><use href="#i-lock"/></svg>
              <input type="password" id="password" name="password" placeholder="Password" autocomplete="current-password" required>
              <button type="button" class="toggle-pw" data-toggle-password="password" aria-label="Show password" aria-pressed="false">
                <svg class="icon i-on" width="18" height="18" aria-hidden="true"><use href="#i-eye"/></svg>
                <svg class="icon i-off" width="18" height="18" aria-hidden="true"><use href="#i-eye-off"/></svg>
              </button>
            </div>
          </div>

          <button type="submit" class="btn btn-primary btn-arrow">Login <svg class="icon" width="20" height="20" aria-hidden="true"><use href="#i-arrow"/></svg></button>
        </form>

        <p class="switch">Don't have an account? <a th:href="@{/register}">Create an account</a></p>
      </section>
    </main>
  </div>

  <div th:replace="~{fragments/auth-js :: script}"></div>
</body>
</html>
