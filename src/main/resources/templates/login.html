<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NexusHire - Login</title>
  <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="auth-page">
  <main class="auth-card">
    <h1 class="brand">Nexus<span>Hire</span></h1>
    <p class="subtitle">Sign in to find your next opportunity</p>

    <div class="alert alert-success" th:if="${success}" th:text="${success}"></div>
    <div class="alert alert-error" th:if="${error}" th:text="${error}"></div>

    <form method="post" th:action="@{/login}">
      <label for="email">Email</label>
      <input type="email" id="email" name="email" th:value="${email}" placeholder="you@example.com" required>

      <label for="password">Password</label>
      <input type="password" id="password" name="password" placeholder="Your password" required>

      <button type="submit" class="btn btn-primary">Login</button>
    </form>

    <p class="switch">New here? <a th:href="@{/register}">Create an account</a></p>
  </main>
</body>
</html>
